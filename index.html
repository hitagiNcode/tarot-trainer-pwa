<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arcana Coach — タロット・リーディング練習アプリ</title>
  <meta name="description" content="オフラインで使えるタロット練習アプリ。78枚のカードガイド、暗記クイズ、スプレッド実践、ブラウザ内のリーディングコーチ。">
  <meta name="theme-color" content="#14102a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcana Coach">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Suit emblem sprite used by the SVG card renderer -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="pip-wands" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 1l3.200 6.200-1.900 1 .3 14.800h-3.200l.3-14.800-1.900-1z"/>
        <path fill="currentColor" d="M5 9c2 0 3.500 1.200 4 3-2 .2-3.600-.6-4-3zm14 0c-2 0-3.500 1.200-4 3 2 .2 3.600-.6 4-3z"/>
      </symbol>
      <symbol id="pip-cups" viewBox="0 0 24 24">
        <path fill="currentColor" d="M4 2h16c0 7-3 11-8 11S4 9 4 2zm7 11h2v7h-2zM6.500 20.500h11V23h-11z"/>
      </symbol>
      <symbol id="pip-swords" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 0l2.600 4.500-.8 11h-3.600l-.8-11zM6 15.500h12V18H6zM10.800 18h2.400v6h-2.400z"/>
      </symbol>
      <symbol id="pip-pentacles" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.500" fill="none" stroke="currentColor" stroke-width="1.800"/>
        <polygon fill="currentColor" points="12,4.200 14.300,9.800 20.300,10.200 15.700,14 17.200,19.800 12,16.600 6.800,19.800 8.300,14 3.700,10.200 9.700,9.800"/>
      </symbol>
    </defs>
  </svg>

  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">🔮</span><h1>Arcana Coach</h1></div>
    <div class="header-actions">
      <button id="langBtn" class="btn btn-small ghost" type="button" data-i18n-aria="lang.aria"><span aria-hidden="true">🌐</span> <span id="langLabel">日本語</span></button>
      <button id="installBtn" class="btn btn-small" type="button" data-i18n="install" hidden>アプリをインストール</button>
    </div>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="メイン">
    <button type="button" class="tab" data-tab="guide"><span class="tab-ico" aria-hidden="true">📖</span><span data-i18n="tab.guide">ガイド</span></button>
    <button type="button" class="tab" data-tab="quiz"><span class="tab-ico" aria-hidden="true">🎯</span><span data-i18n="tab.quiz">クイズ</span></button>
    <button type="button" class="tab" data-tab="expand"><span class="tab-ico" aria-hidden="true">🃏</span><span data-i18n="tab.expand">実践</span></button>
    <button type="button" class="tab" data-tab="journal"><span class="tab-ico" aria-hidden="true">📓</span><span data-i18n="tab.journal">ジャーナル</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria="close" aria-label="閉じる">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">Arcana Coach の利用には JavaScript が必要です。 / Arcana Coach needs JavaScript to run.</p></noscript>

  <script src="data/cards.js"></script>
  <script src="data/cards.ja.js"></script>
  <script src="data/spreads.js"></script>
  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
